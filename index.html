<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ</title>
    <!-- bootstrap -->
    <link rel="stylesheet" href="../lib/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <!-- root css -->
     <link rel="stylesheet" href="../public/css/root.css">
     <!-- home css -->
      <link rel="stylesheet" href="./src/TrangChu/trangchu.css">
     <!-- icon -->
      <link rel="stylesheet" href="../lib/bootstrap-icons-1.13.1/bootstrap-icons.min.css">
      <!-- js -->
       <script src="./lib/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
</head>
<body class="bg-white">
   <div class="wrapper">
     <header id="header" class="d-flex justify-content-between align-items-center bg-primary-app px-2 py-2"></header>
    <main id="main" class="">
      <!-- Banner -->
      <div id="banner" class="py-5 px-2 borde border d-md-flex gap-5 justify-content-center justify-content-lg-between align-items-stretch">
        <div class="banner_left position-relative">
          <h6 class="text-center text-primary-app ex-bold">
          <span data-lang="home.banner.tag1">CHÍNH HÃNG</span> 
          <span><i class="bi bi-dot"></i></span> 
          <span data-lang="home.banner.tag2">BẢO HÀNH 12 THÁNG</span> 
          </h6>
          <h1 class="text-center" data-lang="home.banner.title">Điện thoại chính hãng, giá tốt</h1>
          <h6 class="text-center" data-lang="home.banner.subtitle">Trả góp 0%, giao hàng toàn quốc</h6>
          <button class="btn bg-primary-app ms-40 mt-4 px-4 py-3"  tabindex="-1" class=" text-success ex-bold" onclick="{console.log(window.location.pathname = '/src/SanPham/sanpham.html')}" ><span data-lang="home.banner.buyNow"></span></button>
        </div>
        <div class="banner-right  d-none  me-5 flex-grow-1 h-100 bottom-0 d-lg-flex justify-content-end ">
          <div class="contain_img border w-25   me-5 h-500 rounded-4 ">
            Ảnh ĐT
          </div>
        </div>
      </div>

      <!-- Category -->
    <div id="category" class="py-2 my-2 d-flex px-2 gap-2">
    <div class="category_item flex-fill px-2 py-3 px-md-3 py-md-4 d-flex gap-2 flex-column justify-content-center align-items-center rounded-4 category-card card-iphone">
      <div class="category_icon d-flex justify-content-center align-items-center rounded-circle">
        <i class="bi bi-apple fs-5"></i>
      </div>
      <span class="small fw-medium">iPhone</span>
    </div>

    <div class="category_item flex-fill px-2 py-3 px-md-3 py-md-4 d-flex gap-2 flex-column justify-content-center align-items-center rounded-4 category-card card-android">
      <div class="category_icon d-flex justify-content-center align-items-center rounded-circle">
        <i class="bi bi-android2 fs-5"></i>
      </div>
      <span class="small fw-medium">Android</span>
    </div>

    <div class="category_item flex-fill px-2 py-3 px-md-3 py-md-4 d-flex gap-2 flex-column justify-content-center align-items-center rounded-4 category-card card-accessory">
      <div class="category_icon d-flex justify-content-center align-items-center rounded-circle">
        <i class="bi bi-brush-fill fs-5"></i>
      </div>
      <span class="small fw-medium" data-lang="home.category.accessory">Phụ kiện</span>
    </div>

    <div class="category_item flex-fill px-2 py-3 px-md-3 py-md-4 d-flex gap-2 flex-column justify-content-center align-items-center rounded-4 category-card card-promo">
      <div class="category_icon d-flex justify-content-center align-items-center rounded-circle">
        <i class="bi bi-ticket-perforated-fill fs-5"></i>
      </div>
      <span class="small fw-medium" data-lang="home.category.promo">Khuyến mãi</span>
    </div>
    </div>

    <!-- Product -->
     <div id="product" class="px-3 py-4">
        <div class="product_intro d-flex align-items-center justify-content-between mb-3">
          <sapn class="ex-bold" data-lang="home.product.title">Sản phẩm nổi bậc</sapn>
          <span tabindex="-1" class=" text-success ex-bold" onclick="{console.log(window.location.pathname = '/src/SanPham/sanpham.html')}"><span data-lang="home.product.viewAll"></span><i class="bi bi-arrow-right"></i></span>
        </div>
        <div id="container_products" class="px-3"></div>
        <!-- Toast -->
          <div class="toast-container position-fixed top-0 end-0 p-3 ">
          <div id="cartToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
          <div  id="toastHeader">
          <strong class="me-auto" id="from"></strong>
          <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toastBody">
        </div>
      </div>
          </div>
     </div>

     <!-- About -->
      <div id="about" class="px-3 d-flex flex-column flex-lg-row gap-15 py-3 bold">
        <!-- <div class="d-none d-lg-block p-3">Vì sao chọn chúng tôi</div> -->
        <div class="row flex-grow-1 justify-content-end g-4 ">
          <div class=" col-6 col-lg-3">
            <section class="text-center border border-2 p-3 rounded-3">
              <i class="bi bi-shield-check"></i>
              <span data-lang="home.about.genuine"></span>
            </section>
          </div>
          <div class=" col-6 col-lg-3">
            <section class="text-center border-2 border p-3 rounded-3">
              <i class="bi bi-truck"></i>
              <span data-lang="home.about.shipping"></span>
            </section>
          </div>
       <div class=" col-6 col-lg-3">
            <section class="text-center border border-2 p-3 rounded-3">
              <i class="bi bi-arrow-clockwise"></i>
              <span data-lang="home.about.return"></span>
            </section>
          </div>
        <div class=" col-6 col-lg-3">
            <section class="text-center border border-2 p-3 rounded-3">
              <i class="bi bi-info"></i>
              <span data-lang="home.about.support"></span>
            </section>
          </div>
        </div>
      </div>
    </main>
  </div>
    <footer id="footer" class="px-3"></footer>
     <div id="bottom-placeholder" class=""></div>
   </div>
</body>
<!-- Load header và mobile nav vao -->
<script src="./components/header/loadHeader.js" type="module"></script>
<script src="../../components/footer/loadFooter.js" type="module"></script>
<script src="./components/bottom_mobile/loadBottomMobile.js"  type="module"></script>
<script src="./src/TrangChu/trangchu.js" type="module"></script>
</html>
