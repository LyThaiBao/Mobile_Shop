<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giỏ hàng</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../../lib/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- Root CSS -->
    <link rel="stylesheet" href="../../public/css/root.css">

    <!-- CSS của trang -->
    <link rel="stylesheet" href="./giohang.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="../../lib/bootstrap-icons-1.13.1/bootstrap-icons.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="wrapper">

        <!-- ================= HEADER ================= -->
        <header id="header"
            class="d-flex justify-content-between align-items-center bg-primary-app px-2">
        </header>


        <!-- ================= NỘI DUNG ================= -->
        <main class="cart-page">

    <!-- Tiêu đề -->
    <div class="cart-title">
        <h1>Giỏ hàng <span>(2 sản phẩm)</span></h1>
    </div>

    <div class="cart-layout">

        <!-- ================= DANH SÁCH SẢN PHẨM ================= -->
        <section class="cart-products">

            <!-- SẢN PHẨM 1 -->
            <div class="cart-item">

                <div class="product-img">
                    <img src="../../public/imgs/products/sanpham3/i_2.webp"
                        alt="Mẫu điện thoại A">
                </div>

                <div class="product-info">
                    <h2>Mẫu điện thoại A</h2>

                    <div class="price-red">
                        24.990.000đ
                    </div>
                </div>

                <div class="quantity">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>

                <button class="delete-btn">
                    <i class="fa-regular fa-trash-can"></i>
                </button>

            </div>


            <!-- SẢN PHẨM 2 -->
            <div class="cart-item">

                <div class="product-img">
                    <img src="../../public/imgs/products/sanpham18/i_3.webp"
                        alt="Ốp lưng chống sốc">
                </div>

                <div class="product-info">
                    <h2>Mẫu điện thoại B</h2>

                    <div class="price-red">
                        19.000.000đ
                    </div>
                </div>

                <div class="quantity">
                    <button>-</button>
                    <span>2</span>
                    <button>+</button>
                </div>

                <button class="delete-btn">
                    <i class="fa-regular fa-trash-can"></i>
                </button>

            </div>

        </section>


        <!-- ================= TÓM TẮT ĐƠN HÀNG ================= -->
        <aside class="order-summary">

            <h2>Tóm tắt đơn hàng</h2>

            <div class="summary-row">
                <span>Tạm tính</span>
                <strong>0đ</strong>
            </div>

            <div class="summary-row">
                <span>Vận chuyển</span>
                <strong>Miễn phí</strong>
            </div>

            <div class="summary-line"></div>

            <div class="summary-total">
                <span>Tổng cộng</span>
                <strong>25.370.000đ</strong>
            </div>

            <button class="pay-btn">
                Tiến hành thanh toán
            </button>

        </aside>

    </div>

</main>

        <!-- ================= FOOTER ================= -->
        <footer id="footer" class="px-3"></footer>


        <!-- ================= BOTTOM MOBILE ================= -->
        <div id="bottom-placeholder"></div>

    </div>


    <!-- ================= LOAD COMPONENT ================= -->

    <!-- Header -->
    <script src="../../components/header/loadHeader.js"
        type="module"></script>

    <!-- Bottom mobile -->
    <script src="../../components/bottom_mobile/loadBottomMobile.js"
        type="module"></script>

    <!-- Footer -->
    <script src="../../components/footer/loadFooter.js"
        type="module"></script>

    <!-- JS của trang -->
    <script src="./giohang.js"></script>

</body>

</html>
