<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../../lib/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- Root CSS -->
    <link rel="stylesheet" href="../../public/css/root.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="../../lib/bootstrap-icons-1.13.1/bootstrap-icons.min.css">

    <!-- CSS của trang -->
    <link rel="stylesheet" href="./chitiet.css">
</head>

<body>

    <div class="wrapper">

        <!-- Header -->
        <header id="header"
            class="d-flex justify-content-between align-items-center bg-primary-app px-2">
        </header>

        <!-- Nội dung -->
        <main class="product-page">

            <!-- Hình ảnh sản phẩm -->
            <section class="product-gallery">

          <div class="main-image">
    <img id="mainImage"
         src="../../public/imgs/products/sanpham1/i_1.webp"
         alt="">
</div>

              <div class="thumb-list">
    <img class="thumb active" src="../../public/imgs/products/sanpham1/i_1.webp" alt="">
    <img class="thumb" src="../../public/imgs/products/sanpham1/i_2.webp" alt="">
    <img class="thumb" src="../../public/imgs/products/sanpham1/i_3.webp" alt="">
</div>

            </section>

            <!-- Thông tin sản phẩm -->
            <section class="product-info">

                <h1>Mẫu điện thoại A 256GB</h1>

                <div class="rating">
                    ⭐ 4.8 · 320 đánh giá
                </div>

                <div class="price">
                    <span class="new-price">24.990.000đ</span>
                    <span class="old-price">27.990.000đ</span>
                    <span class="discount">-11%</span>
                </div>

                <h3>DUNG LƯỢNG</h3>

                <div class="storage">
                    <button>256GB</button>
                    <button>512GB</button>
                </div>

                <p>
                    Màn hình sắc nét, pin dùng cả ngày, camera chụp đêm rõ nét.
                    Bảo hành chính hãng 12 tháng, hỗ trợ trả góp 0% qua thẻ tín dụng.
                </p>

                <div class="buttons">
                    <button class="buy-now">
                        Mua ngay
                    </button>

                    <button class="add-cart">
                        Thêm giỏ hàng
                    </button>
                </div>

            </section>

        </main>

         <footer id="footer" class="px-3"></footer>


        <!-- ================= BOTTOM MOBILE ================= -->
        <div id="bottom-placeholder"></div>

    </div>


    <!-- ================= LOAD COMPONENT ================= -->

    <!-- Header -->
    <script src="../../components/header/loadHeader.js"
        type="module"></script>

    <!-- Bottom mobile -->
    <script src="../../components/bottom_mobile/loadBottomMobile.js"
        type="module"></script>

    <!-- Footer -->
    <script src="../../components/footer/loadFooter.js"
        type="module"></script>

    <!-- JS của trang -->
<script src="./chitiet.js"></script>

</body>

</html>
